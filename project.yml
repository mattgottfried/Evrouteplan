name: EVRoutePlan

options:
  bundleIdPrefix: com.evRouteplan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

packages:
  BetterBlueKit:
    url: https://github.com/schmidtwmark/BetterBlueKit
    branch: main

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  EVRoutePlan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/EVRoutePlan
        createIntermediateGroups: true
    dependencies:
      - package: BetterBlueKit
        product: BetterBlueKit
      - sdk: CarPlay.framework
        embed: false
      - sdk: MapKit.framework
        embed: false
      - sdk: CoreLocation.framework
        embed: false
    info:
      path: Sources/EVRoutePlan/App/Info.plist
      properties:
        CFBundleName: EVRoutePlan
        CFBundleDisplayName: EV Route Plan
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay Configuration
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: EVRoutePlan.CarPlaySceneDelegate
        NSLocationWhenInUseUsageDescription: Used to find nearby charging stations
        NSLocationAlwaysAndWhenInUseUsageDescription: Used to find charging stations along your route while navigating
        UIRequiredDeviceCapabilities:
          - arm64
        NREL_API_KEY: $(NREL_API_KEY)
    entitlements:
      path: Sources/EVRoutePlan/App/EVRoutePlan.entitlements
      properties:
        com.apple.developer.carplay-information: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evRouteplan.EVRoutePlan
        PRODUCT_NAME: EVRoutePlan
        NREL_API_KEY: $(NREL_API_KEY)
        ENABLE_HARDENED_RUNTIME: YES

  EVRoutePlanTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/EVRoutePlanTests
    dependencies:
      - target: EVRoutePlan
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.evRouteplan.EVRoutePlanTests
